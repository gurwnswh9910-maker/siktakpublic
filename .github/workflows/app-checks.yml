name: App checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: siktak
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: siktak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U siktak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://siktak:test-only-password@localhost:5432/siktak
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-synthetic-secret-at-least-32-characters
      DEMO_MODE: 'true'
      DEMO_PASSWORD: CI-demo-only-password-2026
      MATCH_EVALUATOR: balanced-v1
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: |
          psql -h localhost -U siktak -d siktak -c 'CREATE DATABASE siktak_test'
          psql -h localhost -U siktak -d siktak -c 'CREATE DATABASE siktak_browser_test'
          DATABASE_URL=postgresql://siktak:test-only-password@localhost:5432/siktak_test npm run db:migrate
      - run: npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_MATCH_EVALUATOR: decisions-v1
          SIKTAK_NOTIFICATION_MINUTE: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: test-results, retention-days: 7}
