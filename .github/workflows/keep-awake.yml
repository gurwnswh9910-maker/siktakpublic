name: Keep demo awake
# 무료 웹은 15분 동안 요청이 없으면 잠든다. 심사 기간에는 10분마다 깨워 둔다.
# 저장소 Settings → Variables에 SIKTAK_DEMO_URL(예: https://siktak-public.onrender.com)을 넣으면 동작한다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.SIKTAK_DEMO_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -sS -o /dev/null --max-time 180 -w "%{http_code} %{time_total}s\n" "${{ vars.SIKTAK_DEMO_URL }}/api/health" || true
